name: CI/CD Pipeline TravelAgency

on:
  push:
    branches: [ "main" ] # Se ejecuta al hacer push a la rama main
  workflow_dispatch: # Permite ejecutarlo con un botón manualmente

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código fuente
      uses: actions/checkout@v3

    - name: 2. Configurar Java JDK (Para el Backend)
      uses: actions/setup-java@v3
      with:
        java-version: '21' 
        distribution: 'temurin'
        cache: maven

    - name: 3. Ejecutar Pruebas Unitarias del Backend
      run: |
        cd Backend
        mvn clean test

    - name: 4. Iniciar sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 5. Construir y Subir Imagen Backend
      uses: docker/build-push-action@v4
      with:
        context: ./Backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/travel-backend:latest

    - name: 6. Construir y Subir Imagen Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./Frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/travel-frontend:latest