events { 
    worker_connections 1024; 
}

http {
    # Aquí definimos a nuestros 3 "trabajadores" del backend
    upstream backend_cluster {
        server travel-backend-1:8088;
        server travel-backend-2:8088;
        server travel-backend-3:8088;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}