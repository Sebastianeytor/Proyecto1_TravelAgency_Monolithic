events { 
    worker_connections 1024; 
}

http {
    # Aquí definimos a nuestras 3 réplicas del frontend
    upstream frontend_cluster {
        server travel-frontend-1:80;
        server travel-frontend-2:80;
        server travel-frontend-3:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}