services:
  db:
    image: postgres:15-alpine
    container_name: travel-db
    environment:
      POSTGRES_DB: travel_agency
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: travel-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "9090:8080" 
    volumes:
      - ./keycloak_data:/opt/keycloak/data
    depends_on:
      - db

  travel-backend-1:
    image: sebastianvasnormandy/travel-backend:latest
    container_name: travel-backend-1
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel_agency
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
    depends_on:
      - db
      - keycloak

  travel-backend-2:
    image: sebastianvasnormandy/travel-backend:latest
    container_name: travel-backend-2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel_agency
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
    depends_on:
      - db
      - keycloak

  travel-backend-3:
    image: sebastianvasnormandy/travel-backend:latest
    container_name: travel-backend-3
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel_agency
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
    depends_on:
      - db
      - keycloak

  nginx-backend:
    image: nginx:latest
    container_name: nginx-backend
    ports:
      - "8088:80" # Nginx expone el 8088 al exterior
    volumes:
      - ./nginx-backend.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - travel-backend-1
      - travel-backend-2
      - travel-backend-3

  travel-frontend-1:
    image: sebastianvasnormandy/travel-frontend:latest
    container_name: travel-frontend-1
    depends_on:
      - nginx-backend

  travel-frontend-2:
    image: sebastianvasnormandy/travel-frontend:latest
    container_name: travel-frontend-2
    depends_on:
      - nginx-backend

  travel-frontend-3:
    image: sebastianvasnormandy/travel-frontend:latest
    container_name: travel-frontend-3
    depends_on:
      - nginx-backend

  nginx-frontend:
    image: nginx:latest
    container_name: nginx-frontend
    ports:
      - "8070:80" # Nginx expone el 8070 al exterior
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - travel-frontend-1
      - travel-frontend-2
      - travel-frontend-3